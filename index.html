<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感触簿 · 日迹</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#faf8f5;--card:#fff;--border:#eae6e0;
 --text:#2c2c2c;--muted:#999590;
 --accent:#d4a373;--accent2:#b5838d;--accent3:#6d6875;--accent4:#8ea4b8;
 --tag-anime:#e8c9c0;--tag-manga:#c9d7d4;--tag-life:#d4c7b0;--tag-game:#bcc9d4;--tag-lit:#c7d4d9;
 --radius:14px;--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.03);
 --mw:860px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:32px 20px 48px;}
/* Header */
.header{max-width:var(--mw);margin:0 auto 30px;display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:24px;font-weight:600;letter-spacing:.5px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header-actions{display:flex;gap:10px}
.header-actions button{background:none;border:1.5px solid var(--border);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer;transition:.2s;display:grid;place-items:center;color:var(--muted);}
.header-actions button:hover{background:var(--card);border-color:var(--accent);color:var(--accent)}
/* Search */
.search-bar{max-width:var(--mw);margin:0 auto 16px;display:none;gap:8px;align-items:center;}
.search-bar.open{display:flex}
.search-bar input{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-size:15px;font-family:inherit;background:var(--card);color:var(--text);outline:none;transition:.2s;}
.search-bar input:focus{border-color:var(--accent)}
.search-bar .search-cancel{flex-shrink:0;padding:8px 16px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;transition:.2s;}
.search-bar .search-cancel:hover{border-color:var(--accent);color:var(--accent)}
.search-hint{max-width:var(--mw);margin:0 auto 10px;font-size:12px;color:var(--muted);display:none;gap:4px;align-items:center;}
.search-hint.open{display:flex}
/* Stats */
.stats{max-width:var(--mw);margin:0 auto 18px;display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);}
.stats span{padding:3px 12px;border-radius:20px;cursor:pointer;transition:.15s;user-select:none}
.stats span:hover{filter:brightness(.88)}
.stats span.active{outline:2px solid currentColor;outline-offset:2px}
.stats .n-anime{background:var(--tag-anime);color:#5c4033}
.stats .n-manga{background:var(--tag-manga);color:#3d5a4e}
.stats .n-game{background:var(--tag-game);color:#3d5266}
.stats .n-life{background:var(--tag-life);color:#5a4e3a}
.stats .n-lit{background:var(--tag-lit);color:#3d5a66}
/* Form */
.form-wrap{max-width:var(--mw);margin:0 auto 18px;display:none}
.form-wrap.open{display:block}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 22px;box-shadow:var(--shadow);margin-bottom:22px;}
.form-card textarea,.form-card input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;resize:vertical;background:var(--bg);color:var(--text);outline:none;transition:.2s;}
.form-card textarea:focus,.form-card input:focus{border-color:var(--accent)}
.form-card textarea{min-height:90px;margin-bottom:14px}
.form-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.form-row label{font-size:14px;color:var(--muted)}
.tag-select{display:flex;gap:8px;flex-wrap:wrap}
.tag-btn{user-select:none;padding:5px 16px;border-radius:20px;border:1.5px solid var(--border);font-size:14px;cursor:pointer;transition:.15s;background:var(--bg);color:var(--text);font-family:inherit;}
.tag-btn.active,.tag-btn:hover{border-color:transparent;color:#fff}
.tag-btn[data-tag="动漫"].active,.tag-btn[data-tag="动漫"]:hover{background:var(--accent2)}
.tag-btn[data-tag="漫画"].active,.tag-btn[data-tag="漫画"]:hover{background:var(--accent)}
.tag-btn[data-tag="游戏"].active,.tag-btn[data-tag="游戏"]:hover{background:var(--accent4)}
.tag-btn[data-tag="生活"].active,.tag-btn[data-tag="生活"]:hover{background:var(--accent3)}
.tag-btn[data-tag="文学"].active,.tag-btn[data-tag="文学"]:hover{background:var(--tag-lit);color:#3d5a66}
.form-actions{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.form-actions .file-label{padding:9px 18px;border-radius:10px;border:1.5px dashed var(--border);font-size:14px;cursor:pointer;color:var(--muted);transition:.2s;display:flex;align-items:center;gap:4px;}
.form-actions .file-label:hover{border-color:var(--accent);color:var(--accent)}
.form-actions .file-label input[type="file"]{display:none}
