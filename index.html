<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感触簿 · 日迹</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf8f5;--card:#fff;--border:#eae6e0;
  --text:#2c2c2c;--muted:#999590;
  --accent:#d4a373;--accent2:#b5838d;--accent3:#6d6875;--accent4:#8ea4b8;
  --tag-anime:#e8c9c0;--tag-manga:#c9d7d4;--tag-life:#d4c7b0;--tag-game:#bcc9d4;
  --radius:14px;--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.03);
  --mw:860px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:32px 20px 48px;}
/* Header */
.header{max-width:var(--mw);margin:0 auto 30px;display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:24px;font-weight:600;letter-spacing:.5px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header-actions{display:flex;gap:10px}
.header-actions button{background:none;border:1.5px solid var(--border);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer;transition:.2s;display:grid;place-items:center;color:var(--muted);}
.header-actions button:hover{background:var(--card);border-color:var(--accent);color:var(--accent)}
/* Search */
.search-bar{max-width:var(--mw);margin:0 auto 16px;display:none;gap:8px;align-items:center;}
.search-bar.open{display:flex}
.search-bar input{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-size:15px;font-family:inherit;background:var(--card);color:var(--text);outline:none;transition:.2s;}
.search-bar input:focus{border-color:var(--accent)}
.search-bar .search-cancel{flex-shrink:0;padding:8px 16px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;transition:.2s;}
.search-bar .search-cancel:hover{border-color:var(--accent);color:var(--accent)}
.search-hint{max-width:var(--mw);margin:0 auto 10px;font-size:12px;color:var(--muted);display:none;gap:4px;align-items:center;}
.search-hint.open{display:flex}
/* Stats */
.stats{max-width:var(--mw);margin:0 auto 18px;display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);}
.stats span{padding:3px 12px;border-radius:20px;cursor:pointer;transition:.15s;user-select:none}
.stats span:hover{filter:brightness(.88)}
.stats span.active{outline:2px solid currentColor;outline-offset:2px}
.stats .n-anime{background:var(--tag-anime);color:#5c4033}
.stats .n-manga{background:var(--tag-manga);color:#3d5a4e}
.stats .n-game{background:var(--tag-game);color:#3d5266}
.stats .n-life{background:var(--tag-life);color:#5a4e3a}
/* Form */
.form-wrap{max-width:var(--mw);margin:0 auto 18px;display:none}
.form-wrap.open{display:block}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 22px;box-shadow:var(--shadow);margin-bottom:22px;}
.form-card textarea,.form-card input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;resize:vertical;background:var(--bg);color:var(--text);outline:none;transition:.2s;}
.form-card textarea:focus,.form-card input:focus{border-color:var(--accent)}
.form-card textarea{min-height:90px;margin-bottom:14px}
.form-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.form-row label{font-size:14px;color:var(--muted)}
.tag-select{display:flex;gap:8px;flex-wrap:wrap}
.tag-btn{user-select:none;padding:5px 16px;border-radius:20px;border:1.5px solid var(--border);font-size:14px;cursor:pointer;transition:.15s;background:var(--bg);color:var(--text);font-family:inherit;}
.tag-btn.active,.tag-btn:hover{border-color:transparent;color:#fff}
.tag-btn[data-tag="动漫"].active,.tag-btn[data-tag="动漫"]:hover{background:var(--accent2)}
.tag-btn[data-tag="漫画"].active,.tag-btn[data-tag="漫画"]:hover{background:var(--accent)}
.tag-btn[data-tag="游戏"].active,.tag-btn[data-tag="游戏"]:hover{background:var(--accent4)}
.tag-btn[data-tag="生活"].active,.tag-btn[data-tag="生活"]:hover{background:var(--accent3)}
.form-actions{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.form-actions .file-label{padding:9px 18px;border-radius:10px;border:1.5px dashed var(--border);font-size:14px;cursor:pointer;color:var(--muted);transition:.2s;display:flex;align-items:center;gap:4px;}
.form-actions .file-label:hover{border-color:var(--accent);color:var(--accent)}
.form-actions .file-label input[type="file"]{display:none}
.form-actions .btn-submit{margin-left:auto;padding:9px 28px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:15px;cursor:pointer;transition:.3s;font-family:inherit;font-weight:500;}
.form-actions .btn-submit:hover{opacity:.85;transform:translateY(-1px)}
.form-actions .btn-cancel{padding:9px 18px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:14px;cursor:pointer;transition:.2s;font-family:inherit;}
.form-actions .btn-cancel:hover{border-color:var(--accent);color:var(--accent)}
/* Card */
.feed{max-width:var(--mw);margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 48px 20px 22px;margin-bottom:14px;box-shadow:var(--shadow);transition:.2s;position:relative;overflow:hidden;}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.07)}
.card .tag{display:inline-block;padding:3px 14px;border-radius:20px;font-size:12px;font-weight:500;letter-spacing:.3px;margin-bottom:10px;user-select:none}
.card .tag.t-anime{background:var(--tag-anime);color:#5c4033}
.card .tag.t-manga{background:var(--tag-manga);color:#3d5a4e}
.card .tag.t-life{background:var(--tag-life);color:#5a4e3a}
.card .tag.t-game{background:var(--tag-game);color:#3d5266}
.card .time{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:4px;}
.card .text{font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.card .img-wrap{margin-top:14px;border-radius:10px;overflow:hidden;max-height:360px;cursor:pointer;}
.card .img-wrap img{width:100%;height:auto;display:block;transition:.3s}
.card .img-wrap img:hover{transform:scale(1.02)}
.card .actions{position:absolute;top:12px;right:14px;display:flex;flex-direction:column;gap:2px;opacity:0;transition:.2s;}
.card:hover .actions{opacity:1}
.card .actions button{background:none;border:none;cursor:pointer;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:14px;color:var(--muted);transition:.2s;}
.card .actions button:hover{background:var(--bg)}
.card .actions .edit-btn:hover{color:var(--accent)}
.card .actions .del-btn:hover{color:#c0392b}
/* Confirm */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;place-items:center;z-index:200;}
.confirm-overlay.open{display:grid}
.confirm-box{background:var(--card);border-radius:var(--radius);padding:24px 28px 20px;box-shadow:0 8px 32px rgba(0,0,0,.12);max-width:320px;text-align:center;}
.confirm-box p{font-size:15px;margin-bottom:18px;color:var(--text)}
.confirm-box .confirm-actions{display:flex;gap:12px;justify-content:center}
.confirm-box .confirm-actions button{padding:7px 22px;border-radius:8px;border:1.5px solid var(--border);font-size:14px;cursor:pointer;font-family:inherit;transition:.2s;background:var(--bg);color:var(--muted);}
.confirm-box .confirm-actions button:hover{border-color:var(--accent);color:var(--accent)}
.confirm-box .confirm-actions .confirm-yes{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
.confirm-box .confirm-actions .confirm-yes:hover{opacity:.85}
/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;place-items:center;z-index:100;cursor:zoom-out;padding:20px;}
.lightbox.open{display:grid}
.lightbox img{max-width:98vw;max-height:92vh;border-radius:8px;object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.4)}
/* Empty */
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty .icon{font-size:44px;margin-bottom:12px}
.empty p{font-size:15px}
@media(max-width:520px){body{padding:18px 12px 32px}.card{padding:16px 40px 16px 16px}.form-card{padding:18px 16px}}
</style>
</head>
<body>

<div class="header">
  <h1>迹<span>·</span></h1>
  <div class="header-actions">
    <button type="button" id="newBtn">✎</button>
    <button type="button" id="searchBtn">🔍</button>
    <button type="button" id="exportBtn">↓</button>
  </div>
</div>

<div class="search-bar" id="searchBar">
  <input type="text" id="searchInput" placeholder="检索笔记中的文字…" autocomplete="off">
  <button type="button" class="search-cancel" id="searchCancelBtn">取消</button>
</div>
<div class="search-hint" id="searchHint"></div>
<div class="stats" id="stats"></div>

<div class="form-wrap" id="formWrap">
  <div class="form-card">
    <textarea id="inputText" placeholder="今天有什么想记下的…" rows="3"></textarea>
    <div class="form-row">
      <label>分类</label>
      <div class="tag-select" id="tagSelect">
        <button type="button" class="tag-btn" data-tag="动漫">动漫</button>
        <button type="button" class="tag-btn" data-tag="漫画">漫画</button>
        <button type="button" class="tag-btn" data-tag="游戏">游戏</button>
        <button type="button" class="tag-btn" data-tag="生活">生活</button>
      </div>
    </div>
    <div class="form-actions">
      <label class="file-label"><span>🖼</span> 配图<input type="file" id="inputFile" accept="image/*"></label>
      <span id="fileName" style="font-size:12px;color:var(--muted);align-self:center"></span>
      <button type="button" class="btn-cancel" id="cancelBtn">取消</button>
      <button type="button" class="btn-submit" id="submitBtn">记下</button>
    </div>
  </div>
</div>

<div class="feed" id="feed"></div>
<div class="lightbox" id="lightbox"><img id="lbImg" src="" alt=""></div>
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmText"></p>
    <div class="confirm-actions">
      <button type="button" class="confirm-no" id="confirmNo">取消</button>
      <button type="button" class="confirm-yes" id="confirmYes">确定</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'memento_entries';
let allEntries = [];
let entries = [];
let editIdx = -1;
let filterTag = null;
let searchActive = false;

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    allEntries = raw ? JSON.parse(raw) : [];
  } catch(e) { allEntries = []; }
  doViewUpdate();
}

function saveToDisk(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(allEntries));
}

function doViewUpdate(){
  entries = filterTag ? allEntries.filter(e => e.tag === filterTag) : allEntries.slice();
  if (searchActive) {
    const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    if (q) entries = entries.filter(e => (e.text || '').toLowerCase().includes(q));
  }
  renderCards();
}

function renderCards(){
  const feed = document.getElementById('feed');
  const stats = document.getElementById('stats');
  const counts = {动漫:0,漫画:0,游戏:0,生活:0};
  allEntries.forEach(e => { if (counts[e.tag] !== undefined) counts[e.tag]++; });
  const act = l => filterTag === l ? ' active' : '';
  stats.innerHTML = `
    <span class="n-anime${act('动漫')}" data-tag="动漫">动漫 ${counts.动漫}</span>
    <span class="n-manga${act('漫画')}" data-tag="漫画">漫画 ${counts.漫画}</span>
    <span class="n-game${act('游戏')}" data-tag="游戏">游戏 ${counts.游戏}</span>
    <span class="n-life${act('生活')}" data-tag="生活">生活 ${counts.生活}</span>
    ${filterTag ? `<span style="margin-left:auto;opacity:.6">${entries.length}/${allEntries.length}</span>`
      : searchActive ? `<span style="margin-left:auto;opacity:.6">检索到 ${entries.length} 条</span>`
      : `<span style="margin-left:auto;opacity:.6">共 ${allEntries.length} 条</span>`}
  `;
  stats.querySelectorAll('[data-tag]').forEach(el => {
    el.addEventListener('click', function(){
      filterTag = (filterTag === this.dataset.tag) ? null : this.dataset.tag;
      doViewUpdate();
    });
  });

  if (!entries.length) {
    feed.innerHTML = `<div class="empty"><div class="icon">📖</div><p>还没有记录，点 ✎ 写点什么吧</p></div>`;
    return;
  }

  const tagCls = {动漫:'t-anime',漫画:'t-manga',游戏:'t-game',生活:'t-life'};
  feed.innerHTML = entries.map(e => {
    const realIdx = allEntries.indexOf(e);
    const t = e.time || e.createdAt;
    const d = new Date(t);
    const ts = d.toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const img = e.image ? `<div class="img-wrap" data-real="${realIdx}"><img src="${e.image}" loading="lazy" alt=""></div>` : '';
    return `<div class="card" data-real="${realIdx}">
      <span class="tag ${tagCls[e.tag]||''}">${e.tag}</span>
      <div class="time">${ts}</div>
      <div class="text">${esc(e.text)}</div>
      ${img}
      <div class="actions">
        <button type="button" class="edit-btn" data-real="${realIdx}">✏</button>
        <button type="button" class="del-btn" data-real="${realIdx}">✕</button>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('.img-wrap').forEach(el => {
    el.addEventListener('click', function(){
      const r = parseInt(this.dataset.real);
      document.getElementById('lbImg').src = allEntries[r].image;
      document.getElementById('lightbox').classList.add('open');
    });
  });
  document.querySelectorAll('.edit-btn').forEach(el => {
    el.addEventListener('click', function(e){
      e.stopPropagation();
      openEdit(parseInt(this.dataset.real));
    });
  });
  document.querySelectorAll('.del-btn').forEach(el => {
    el.addEventListener('click', function(e){
      e.stopPropagation();
      const r = parseInt(this.dataset.real);
      showConfirm('删除这条记录？', () => {
        allEntries.splice(r, 1);
        saveToDisk();
        if (filterTag) filterTag = null;
        if (searchActive) { searchActive = false; document.getElementById('searchInput').value = ''; document.getElementById('searchHint').classList.remove('open'); }
        doViewUpdate();
      });
    });
  });
}

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

let selectedTag = '生活';
document.getElementById('tagSelect').addEventListener('click', function(e){
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  this.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedTag = btn.dataset.tag;
});
document.querySelector('.tag-btn[data-tag="生活"]').classList.add('active');

const formWrap = document.getElementById('formWrap');

function resetForm(){
  editIdx = -1;
  document.getElementById('inputText').value = '';
  document.getElementById('inputFile').value = '';
  document.getElementById('fileName').textContent = '';
  document.getElementById('submitBtn').textContent = '记下';
  selectedTag = '生活';
  document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.tag-btn[data-tag="生活"]').classList.add('active');
  const p = document.getElementById('imgPreview');
  if (p) p.remove();
}

function openEdit(realIdx){
  const e = allEntries[realIdx];
  if (!e) return;
  editIdx = realIdx;
  document.getElementById('inputText').value = e.text || '';
  document.getElementById('submitBtn').textContent = '保存';
  selectedTag = e.tag;
  document.querySelectorAll('.tag-btn').forEach(b => b.classList.toggle('active', b.dataset.tag === e.tag));
  let prev = document.getElementById('imgPreview');
  if (!prev) {
    prev = document.createElement('span');
    prev.id = 'imgPreview';
    prev.style.cssText = 'font-size:12px;color:var(--accent2);align-self:center;cursor:pointer;';
    document.querySelector('.file-label').after(prev);
  }
  prev.textContent = e.image ? '🖼 有图（点这里换）' : '';
  prev.dataset.hasImage = e.image ? '1' : '0';
  document.getElementById('inputFile').value = '';
  formWrap.classList.add('open');
  document.getElementById('inputText').focus();
}

document.getElementById('newBtn').addEventListener('click', function(){
  if (formWrap.classList.contains('open')) { formWrap.classList.remove('open'); return; }
  resetForm();
  formWrap.classList.add('open');
  document.getElementById('inputText').focus();
});

document.getElementById('cancelBtn').addEventListener('click', function(){
  formWrap.classList.remove('open');
});

document.getElementById('inputFile').addEventListener('change', function(){
  document.getElementById('fileName').textContent = this.files[0] ? this.files[0].name : '';
  const p = document.getElementById('imgPreview');
  if (p && this.files[0]) { p.textContent = '🖼 已选新图'; p.dataset.hasImage = '0'; }
});

document.getElementById('submitBtn').addEventListener('click', function(){
  const text = document.getElementById('inputText').value.trim();
  const file = document.getElementById('inputFile').files[0];
  if (!text && !file) { alert('写点什么或选张图吧'); return; }

  const reader = new FileReader();
  reader.onload = function(evt){
    const imageData = file ? evt.target.result : null;

    if (editIdx >= 0) {
      allEntries[editIdx].text = text || '';
      allEntries[editIdx].tag = selectedTag;
      if (imageData) allEntries[editIdx].image = imageData;
    } else {
      allEntries.unshift({ text: text || '', tag: selectedTag, image: imageData, time: new Date().toISOString() });
    }

    formWrap.classList.remove('open');
    resetForm();
    filterTag = null;
    searchActive = false;
    document.getElementById('searchBar').classList.remove('open');
    document.getElementById('searchInput').value = '';
    document.getElementById('searchHint').classList.remove('open');
    saveToDisk();
    doViewUpdate();
  };

  reader.onerror = function(){ alert('图片读取失败'); };

  if (file) {
    if (file.size > 10 * 1024 * 1024) { alert('图片不要超过 10MB 哦'); return; }
    reader.readAsDataURL(file);
  } else {
    reader.onload();
  }
});

document.getElementById('lightbox').addEventListener('click', function(){ this.classList.remove('open'); });

document.getElementById('exportBtn').addEventListener('click', function(){
  const blob = new Blob([JSON.stringify(allEntries, null, 2)], {type:'application/json;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'memento_export_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

function doSearch(query){
  const q = query.trim().toLowerCase();
  if (!q) {
    searchActive = false;
    document.getElementById('searchHint').classList.remove('open');
    doViewUpdate();
    return;
  }
  searchActive = true;
  doViewUpdate();
  document.getElementById('searchHint').classList.add('open');
  document.getElementById('searchHint').innerHTML = '🔎 共 ' + entries.length + ' 条匹配「' + esc(query.trim()) + '」';
}

function exitSearch(){
  searchActive = false;
  document.getElementById('searchBar').classList.remove('open');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchHint').classList.remove('open');
  doViewUpdate();
}

document.getElementById('searchBtn').addEventListener('click', function(){
  const bar = document.getElementById('searchBar');
  if (bar.classList.contains('open')) { exitSearch(); return; }
  bar.classList.add('open');
  document.getElementById('searchInput').focus();
  document.getElementById('searchInput').value = '';
  document.getElementById('searchHint').classList.remove('open');
  searchActive = false;
  doViewUpdate();
});

document.getElementById('searchInput').addEventListener('input', function(){ doSearch(this.value); });
document.getElementById('searchInput').addEventListener('keydown', function(e){ if (e.key === 'Escape') exitSearch(); });
document.getElementById('searchCancelBtn').addEventListener('click', exitSearch);

let confirmCb = null;
function showConfirm(msg, onYes){
  confirmCb = onYes;
  document.getElementById('confirmText').textContent = msg;
  document.getElementById('confirmOverlay').classList.add('open');
}
document.getElementById('confirmYes').addEventListener('click', function(){
  document.getElementById('confirmOverlay').classList.remove('open');
  if (confirmCb) { const cb = confirmCb; confirmCb = null; cb(); }
});
document.getElementById('confirmNo').addEventListener('click', function(){
  document.getElementById('confirmOverlay').classList.remove('open');
  confirmCb = null;
});
document.getElementById('confirmOverlay').addEventListener('click', function(e){
  if (e.target === this) { this.classList.remove('open'); confirmCb = null; }
});

load();
</script>
</body>
</html>
