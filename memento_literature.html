<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>迹·</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#faf8f5;--card:#fff;--border:#eae6e0;
 --text:#2c2c2c;--muted:#8c8782;
 --accent:#d4a373;--accent2:#b5838d;--accent3:#6d6875;--accent4:#8ea4b8;
 --tag-anime:#e8c9c0;--tag-manga:#c9d7d4;--tag-life:#d4c7b0;--tag-game:#bcc9d4;--tag-lit:#c7d4d9;
 --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.03);
 --mw:860px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:32px 20px 48px}
button,input,textarea{font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.header{max-width:var(--mw);margin:0 auto 30px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.header h1{font-size:24px;font-weight:600;letter-spacing:.5px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-actions{display:flex;gap:10px}
.header-actions button{background:none;border:1.5px solid var(--border);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer;transition:.2s;display:grid;place-items:center;color:var(--muted)}
.header-actions button:hover{background:var(--card);border-color:var(--accent);color:var(--accent)}
.search-bar{max-width:var(--mw);margin:0 auto 16px;display:none;gap:8px;align-items:center}
.search-bar.open{display:flex}
.search-bar input{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-size:15px;background:var(--card);color:var(--text);outline:none;transition:.2s}
.search-bar input:focus{border-color:var(--accent)}
.search-bar .search-cancel{flex-shrink:0;padding:8px 16px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:13px;cursor:pointer;transition:.2s}
.search-bar .search-cancel:hover{border-color:var(--accent);color:var(--accent)}
.search-hint{max-width:var(--mw);margin:0 auto 10px;font-size:12px;color:var(--muted);display:none;gap:4px;align-items:center}
.search-hint.open{display:flex}
.stats{max-width:var(--mw);margin:0 auto 18px;display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.stats span{padding:3px 12px;border-radius:20px;cursor:pointer;transition:.15s;user-select:none}
.stats span:hover{filter:brightness(.88)}
.stats span.active{outline:2px solid currentColor;outline-offset:2px}
.stats .n-anime{background:var(--tag-anime);color:#5c4033}
.stats .n-manga{background:var(--tag-manga);color:#3d5a4e}
.stats .n-game{background:var(--tag-game);color:#3d5266}
.stats .n-life{background:var(--tag-life);color:#5a4e3a}
.stats .n-lit{background:var(--tag-lit);color:#3d5a66}
.form-wrap{max-width:var(--mw);margin:0 auto 18px;display:none}
.form-wrap.open{display:block}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 22px;box-shadow:var(--shadow);margin-bottom:22px}
.form-card textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;resize:vertical;background:var(--bg);color:var(--text);outline:none;transition:.2s;min-height:90px;margin-bottom:14px}
.form-card textarea:focus{border-color:var(--accent)}
.form-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.form-row label{font-size:14px;color:var(--muted)}
.tag-select{display:flex;gap:8px;flex-wrap:wrap}
.tag-btn{user-select:none;padding:5px 16px;border-radius:20px;border:1.5px solid var(--border);font-size:14px;cursor:pointer;transition:.15s;background:var(--bg);color:var(--text)}
.tag-btn.active,.tag-btn:hover{border-color:transparent;color:#fff}
.tag-btn[data-tag="动漫"].active,.tag-btn[data-tag="动漫"]:hover{background:var(--accent2)}
.tag-btn[data-tag="漫画"].active,.tag-btn[data-tag="漫画"]:hover{background:var(--accent)}
.tag-btn[data-tag="游戏"].active,.tag-btn[data-tag="游戏"]:hover{background:var(--accent4)}
.tag-btn[data-tag="生活"].active,.tag-btn[data-tag="生活"]:hover{background:var(--accent3)}
.tag-btn[data-tag="文学"].active,.tag-btn[data-tag="文学"]:hover{background:var(--tag-lit);color:#3d5a66}
.form-actions{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;align-items:center}
.form-actions .file-label{padding:9px 18px;border-radius:10px;border:1.5px dashed var(--border);font-size:14px;cursor:pointer;color:var(--muted);transition:.2s;display:flex;align-items:center;gap:4px}
.form-actions .file-label:hover{border-color:var(--accent);color:var(--accent)}
.form-actions .file-label input[type="file"]{display:none}
.file-note{font-size:12px;color:var(--muted);align-self:center}
.remove-image{display:none;border:none;background:transparent;color:#c0392b;font-size:12px;cursor:pointer;padding:6px 4px}
.remove-image.show{display:inline-flex}
.form-actions .btn-submit{margin-left:auto;padding:9px 28px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:15px;cursor:pointer;transition:.3s;font-weight:500}
.form-actions .btn-submit:hover{opacity:.85;transform:translateY(-1px)}
.form-actions .btn-cancel{padding:9px 18px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:14px;cursor:pointer;transition:.2s}
.form-actions .btn-cancel:hover{border-color:var(--accent);color:var(--accent)}
.feed{max-width:var(--mw);margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 48px 20px 22px;margin-bottom:14px;box-shadow:var(--shadow);transition:.2s;position:relative;overflow:hidden}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.07)}
.card .tag{display:inline-block;padding:3px 14px;border-radius:20px;font-size:12px;font-weight:500;letter-spacing:.3px;margin-bottom:10px;user-select:none}
.card .tag.t-anime{background:var(--tag-anime);color:#5c4033}
.card .tag.t-manga{background:var(--tag-manga);color:#3d5a4e}
.card .tag.t-life{background:var(--tag-life);color:#5a4e3a}
.card .tag.t-game{background:var(--tag-game);color:#3d5266}
.card .tag.t-lit{background:var(--tag-lit);color:#3d5a66}
.card .time{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:4px}
.card .text{font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.card .img-wrap{margin-top:14px;border-radius:10px;overflow:hidden;max-height:360px;cursor:pointer;background:#f1eee9}
.card .img-wrap img{width:100%;height:auto;display:block;transition:.3s}
.card .img-wrap img:hover{transform:scale(1.02)}
.card .actions{position:absolute;top:12px;right:14px;display:flex;flex-direction:column;gap:2px;opacity:0;transition:.2s}
.card:hover .actions,.card:focus-within .actions{opacity:1}
.card .actions button{background:none;border:none;cursor:pointer;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:14px;color:var(--muted);transition:.2s}
.card .actions button:hover{background:var(--bg)}
.card .actions .edit-btn:hover{color:var(--accent)}
.card .actions .del-btn:hover{color:#c0392b}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;place-items:center;z-index:200;padding:20px}
.confirm-overlay.open{display:grid}
.confirm-box{background:var(--card);border-radius:var(--radius);padding:24px 28px 20px;box-shadow:0 8px 32px rgba(0,0,0,.12);max-width:320px;text-align:center}
.confirm-box p{font-size:15px;margin-bottom:18px;color:var(--text)}
.confirm-box .confirm-actions{display:flex;gap:12px;justify-content:center}
.confirm-box .confirm-actions button{padding:7px 22px;border-radius:8px;border:1.5px solid var(--border);font-size:14px;cursor:pointer;transition:.2s;background:var(--bg);color:var(--muted)}
.confirm-box .confirm-actions button:hover{border-color:var(--accent);color:var(--accent)}
.confirm-box .confirm-actions .confirm-yes{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.confirm-box .confirm-actions .confirm-yes:hover{opacity:.85}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;place-items:center;z-index:100;cursor:zoom-out;padding:20px}
.lightbox.open{display:grid}
.lightbox img{max-width:98vw;max-height:92vh;border-radius:8px;object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty .icon{font-size:44px;margin-bottom:12px}
.empty p{font-size:15px}
@media(max-width:520px){
 body{padding:18px 12px 32px}
 .header{margin-bottom:22px}
 .card{padding:16px 40px 16px 16px}
 .form-card{padding:18px 16px}
 .form-actions .btn-submit{margin-left:0;flex:1}
}
</style>
</head>
<body>

<div class="header">
 <h1>迹·</h1>
 <div class="header-actions">
 <button type="button" id="newBtn" title="新建记录" aria-label="新建记录">✎</button>
 <button type="button" id="searchBtn" title="搜索记录" aria-label="搜索记录">🔍</button>
 <button type="button" id="exportBtn" title="导出备份" aria-label="导出备份">↓</button>
 <button type="button" id="importBtn" title="导入备份" aria-label="导入备份" style="font-size:16px">↩</button>
 <input type="file" id="importFile" accept=".json,application/json" style="display:none">
 </div>
</div>

<div class="search-bar" id="searchBar">
 <input type="search" id="searchInput" placeholder="搜索笔记、分类或日期…" autocomplete="off" aria-label="搜索笔记">
 <button type="button" class="search-cancel" id="searchCancelBtn">取消</button>
</div>
<div class="search-hint" id="searchHint" aria-live="polite"></div>
<div class="stats" id="stats"></div>

<div class="form-wrap" id="formWrap">
 <div class="form-card">
 <textarea id="inputText" placeholder="今天有什么想记下的…" rows="3"></textarea>
 <div class="form-row">
 <label>分类</label>
 <div class="tag-select" id="tagSelect">
 <button type="button" class="tag-btn" data-tag="动漫">动漫</button>
 <button type="button" class="tag-btn" data-tag="漫画">漫画</button>
 <button type="button" class="tag-btn" data-tag="游戏">游戏</button>
 <button type="button" class="tag-btn" data-tag="生活">生活</button>
 <button type="button" class="tag-btn" data-tag="文学">文学</button>
 </div>
 </div>
 <div class="form-actions">
 <label class="file-label"><span>🖼</span> 配图<input type="file" id="inputFile" accept="image/*"></label>
 <span id="fileName" class="file-note"></span>
 <button type="button" class="remove-image" id="removeImageBtn">移除旧图</button>
 <button type="button" class="btn-cancel" id="cancelBtn">取消</button>
 <button type="button" class="btn-submit" id="submitBtn">记下</button>
 </div>
 </div>
</div>

<div class="feed" id="feed"></div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="查看图片"><img id="lbImg" src="" alt=""></div>
<div class="confirm-overlay" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="confirmText">
 <div class="confirm-box">
 <p id="confirmText"></p>
 <div class="confirm-actions">
 <button type="button" class="confirm-no" id="confirmNo">取消</button>
 <button type="button" class="confirm-yes" id="confirmYes">确定</button>
 </div>
 </div>
</div>

<script>
const STORAGE_KEY = 'memento_entries';
const TAGS = ['动漫', '漫画', '游戏', '生活', '文学'];
const TAG_CLASS = {动漫:'t-anime',漫画:'t-manga',游戏:'t-game',生活:'t-life',文学:'t-lit'};
const TAG_COUNT_CLASS = {动漫:'n-anime',漫画:'n-manga',游戏:'n-game',生活:'n-life',文学:'n-lit'};
const MAX_IMAGE_INPUT_BYTES = 12 * 1024 * 1024;
const MAX_IMAGE_SIDE = 1600;
const IMAGE_QUALITY = 0.82;

let allEntries = [];
let entries = [];
let editId = null;
let filterTag = null;
let searchActive = false;
let selectedTag = '生活';
let removeExistingImage = false;
let confirmCb = null;

const $ = id => document.getElementById(id);

function makeId(){
 if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
 return 'm_' + Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function normalizeEntry(item){
 if (!item || typeof item !== 'object') return null;
 const tag = TAGS.includes(item.tag) ? item.tag : '生活';
 const text = typeof item.text === 'string' ? item.text : '';
 const image = typeof item.image === 'string' && /^data:image\/(png|jpe?g|webp|gif);base64,/i.test(item.image) ? item.image : null;
 if (!text.trim() && !image) return null;
 const time = Number.isNaN(Date.parse(item.time || item.createdAt)) ? new Date().toISOString() : new Date(item.time || item.createdAt).toISOString();
 return {id: typeof item.id === 'string' && item.id ? item.id : makeId(), text, tag, image, time};
}

function sortEntries(){
 allEntries.sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));
}

function load(){
 try {
 const raw = localStorage.getItem(STORAGE_KEY);
 const parsed = raw ? JSON.parse(raw) : [];
 allEntries = Array.isArray(parsed) ? parsed.map(normalizeEntry).filter(Boolean) : [];
 sortEntries();
 saveToDisk({silent:true});
 } catch(e) {
 allEntries = [];
 alert('本地记录读取失败，已先打开空白列表。建议检查最近导入的备份文件。');
 }
 doViewUpdate();
}

function saveToDisk(options = {}){
 try {
 localStorage.setItem(STORAGE_KEY, JSON.stringify(allEntries));
 return true;
 } catch(e) {
 if (!options.silent) {
 alert('保存失败：浏览器本地空间可能满了。请先导出备份，删除几张大图，或换用更小的配图。');
 }
 return false;
 }
}

function doViewUpdate(){
 const q = ($('searchInput').value || '').trim().toLowerCase();
 entries = allEntries.filter(e => {
 if (filterTag && e.tag !== filterTag) return false;
 if (!searchActive || !q) return true;
 const dateText = formatTime(e.time).toLowerCase();
 return (e.text || '').toLowerCase().includes(q) || e.tag.toLowerCase().includes(q) || dateText.includes(q);
 });
 renderCards();
}

function formatTime(value){
 const d = new Date(value);
 if (Number.isNaN(d.getTime())) return '未知时间';
 return d.toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function renderStats(stats){
 const counts = Object.fromEntries(TAGS.map(tag => [tag, 0]));
 allEntries.forEach(e => { if (counts[e.tag] !== undefined) counts[e.tag]++; });
 const summary = filterTag ? `${entries.length}/${allEntries.length}` : searchActive ? `搜索到 ${entries.length} 条` : `共 ${allEntries.length} 条`;
 stats.innerHTML = TAGS.map(tag => `<span class="${TAG_COUNT_CLASS[tag]}${filterTag === tag ? ' active' : ''}" data-tag="${tag}">${tag} ${counts[tag]}</span>`).join('') + `<span style="margin-left:auto;opacity:.6">${summary}</span>`;
 stats.querySelectorAll('[data-tag]').forEach(el => {
 el.addEventListener('click', function(){
 filterTag = (filterTag === this.dataset.tag) ? null : this.dataset.tag;
 doViewUpdate();
 });
 });
}

function renderCards(){
 const feed = $('feed');
 renderStats($('stats'));
 if (!entries.length) {
 feed.innerHTML = `<div class="empty"><div class="icon">📖</div><p>${searchActive || filterTag ? '没有匹配的记录' : '还没有记录，点 ✎ 写点什么吧'}</p></div>`;
 return;
 }
 feed.innerHTML = entries.map(e => {
 const img = e.image ? `<div class="img-wrap" data-id="${escAttr(e.id)}"><img src="${e.image}" loading="lazy" alt="记录配图"></div>` : '';
 return `<article class="card" data-id="${escAttr(e.id)}">
 <span class="tag ${TAG_CLASS[e.tag] || ''}">${esc(e.tag)}</span>
 <div class="time">${formatTime(e.time)}</div>
 <div class="text">${esc(e.text)}</div>
 ${img}
 <div class="actions">
 <button type="button" class="edit-btn" data-id="${escAttr(e.id)}" title="编辑" aria-label="编辑记录">✏</button>
 <button type="button" class="del-btn" data-id="${escAttr(e.id)}" title="删除" aria-label="删除记录">✕</button>
 </div>
 </article>`;
 }).join('');

 document.querySelectorAll('.img-wrap').forEach(el => {
 el.addEventListener('click', function(){
 const entry = findEntry(this.dataset.id);
 if (!entry || !entry.image) return;
 $('lbImg').src = entry.image;
 $('lightbox').classList.add('open');
 });
 });
 document.querySelectorAll('.edit-btn').forEach(el => {
 el.addEventListener('click', function(e){
 e.stopPropagation();
 openEdit(this.dataset.id);
 });
 });
 document.querySelectorAll('.del-btn').forEach(el => {
 el.addEventListener('click', function(e){
 e.stopPropagation();
 const id = this.dataset.id;
 showConfirm('删除这条记录？', () => {
 allEntries = allEntries.filter(item => item.id !== id);
 if (saveToDisk()) doViewUpdate();
 });
 });
 });
}

function findEntry(id){
 return allEntries.find(e => e.id === id);
}

function esc(s){
 const d = document.createElement('div');
 d.textContent = s == null ? '' : String(s);
 return d.innerHTML;
}

function escAttr(s){
 return esc(s).replace(/"/g, '&quot;');
}

function setSelectedTag(tag){
 selectedTag = TAGS.includes(tag) ? tag : '生活';
 document.querySelectorAll('.tag-btn').forEach(b => b.classList.toggle('active', b.dataset.tag === selectedTag));
}

$('tagSelect').addEventListener('click', function(e){
 const btn = e.target.closest('.tag-btn');
 if (!btn) return;
 setSelectedTag(btn.dataset.tag);
});
setSelectedTag('生活');

function resetForm(){
 editId = null;
 removeExistingImage = false;
 $('inputText').value = '';
 $('inputFile').value = '';
 $('fileName').textContent = '';
 $('submitBtn').textContent = '记下';
 $('removeImageBtn').classList.remove('show');
 setSelectedTag('生活');
}

function openEdit(id){
 const e = findEntry(id);
 if (!e) return;
 editId = id;
 removeExistingImage = false;
 $('inputText').value = e.text || '';
 $('submitBtn').textContent = '保存';
 $('fileName').textContent = e.image ? '已有配图；选择新图可替换' : '';
 $('removeImageBtn').classList.toggle('show', Boolean(e.image));
 setSelectedTag(e.tag);
 $('inputFile').value = '';
 $('formWrap').classList.add('open');
 $('inputText').focus();
}

$('newBtn').addEventListener('click', function(){
 if ($('formWrap').classList.contains('open') && !editId) {
 $('formWrap').classList.remove('open');
 return;
 }
 resetForm();
 $('formWrap').classList.add('open');
 $('inputText').focus();
});

$('cancelBtn').addEventListener('click', function(){
 $('formWrap').classList.remove('open');
 resetForm();
});

$('removeImageBtn').addEventListener('click', function(){
 removeExistingImage = true;
 $('inputFile').value = '';
 $('fileName').textContent = '已标记移除旧图';
 this.classList.remove('show');
});

$('inputFile').addEventListener('change', function(){
 const file = this.files[0];
 removeExistingImage = false;
 $('fileName').textContent = file ? `${file.name}（保存时会自动压缩）` : '';
});

async function imageFileToDataUrl(file){
 if (!file) return null;
 if (!file.type.startsWith('image/')) throw new Error('请选择图片文件');
 if (file.size > MAX_IMAGE_INPUT_BYTES) throw new Error('图片不要超过 12MB');
 const bitmap = await createImageBitmap(file);
 const scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(bitmap.width, bitmap.height));
 const width = Math.max(1, Math.round(bitmap.width * scale));
 const height = Math.max(1, Math.round(bitmap.height * scale));
 const canvas = document.createElement('canvas');
 canvas.width = width;
 canvas.height = height;
 const ctx = canvas.getContext('2d');
 ctx.drawImage(bitmap, 0, 0, width, height);
 if (bitmap.close) bitmap.close();
 return canvas.toDataURL('image/jpeg', IMAGE_QUALITY);
}

$('submitBtn').addEventListener('click', async function(){
 const text = $('inputText').value.trim();
 const file = $('inputFile').files[0];
 if (!text && !file && !removeExistingImage) {
 alert('写点什么或选张图吧');
 return;
 }
 const btn = this;
 btn.disabled = true;
 const oldLabel = btn.textContent;
 btn.textContent = '保存中…';
 try {
 const imageData = file ? await imageFileToDataUrl(file) : null;
 if (editId) {
 const entry = findEntry(editId);
 if (!entry) throw new Error('要编辑的记录不存在');
 entry.text = text;
 entry.tag = selectedTag;
 if (imageData) entry.image = imageData;
 if (removeExistingImage) entry.image = null;
 } else {
 allEntries.unshift({id:makeId(), text, tag:selectedTag, image:imageData, time:new Date().toISOString()});
 }
 sortEntries();
 if (!saveToDisk()) return;
 $('formWrap').classList.remove('open');
 resetForm();
 doViewUpdate();
 } catch(e) {
 alert(e.message || '保存失败，请稍后再试');
 } finally {
 btn.disabled = false;
 btn.textContent = oldLabel;
 }
});

$('lightbox').addEventListener('click', function(){
 this.classList.remove('open');
 $('lbImg').src = '';
});

$('importBtn').addEventListener('click', function(){
 $('importFile').click();
});

$('importFile').addEventListener('change', function(e){
 const file = e.target.files[0];
 if (!file) return;
 const r = new FileReader();
 r.onload = function(evt){
 try {
 const data = JSON.parse(evt.target.result);
 if (!Array.isArray(data)) {
 alert('文件格式不对');
 return;
 }
 const oldLen = allEntries.length;
 const known = new Set(allEntries.map(item => item.id));
 data.forEach(item => {
 const normalized = normalizeEntry(item);
 if (!normalized) return;
 const fingerprint = `${normalized.text}|${normalized.tag}|${normalized.time}`;
 const duplicated = allEntries.some(ex => ex.id === normalized.id || `${ex.text}|${ex.tag}|${ex.time}` === fingerprint);
 if (!duplicated) {
 if (known.has(normalized.id)) normalized.id = makeId();
 known.add(normalized.id);
 allEntries.push(normalized);
 }
 });
 sortEntries();
 const added = allEntries.length - oldLen;
 if (saveToDisk()) {
 doViewUpdate();
 alert(`导入完成\n新增 ${added} 条记录\n原有 ${oldLen} 条记录已保留`);
 }
 } catch(err) {
 alert('文件解析失败，请确认是感触簿导出的 JSON 文件');
 }
 };
 r.readAsText(file);
 this.value = '';
});

$('exportBtn').addEventListener('click', function(){
 const blob = new Blob([JSON.stringify(allEntries, null, 2)], {type:'application/json;charset=utf-8'});
 const a = document.createElement('a');
 a.href = URL.createObjectURL(blob);
 a.download = 'memento_export_' + new Date().toISOString().slice(0,10) + '.json';
 a.click();
 URL.revokeObjectURL(a.href);
});

function doSearch(query){
 const q = query.trim();
 if (!q) {
 searchActive = false;
 $('searchHint').classList.remove('open');
 doViewUpdate();
 return;
 }
 searchActive = true;
 doViewUpdate();
 $('searchHint').classList.add('open');
 $('searchHint').textContent = `🔎 共 ${entries.length} 条匹配「${q}」`;
}

function exitSearch(){
 searchActive = false;
 $('searchBar').classList.remove('open');
 $('searchInput').value = '';
 $('searchHint').classList.remove('open');
 doViewUpdate();
}

$('searchBtn').addEventListener('click', function(){
 const bar = $('searchBar');
 if (bar.classList.contains('open')) {
 exitSearch();
 return;
 }
 bar.classList.add('open');
 $('searchInput').focus();
 $('searchInput').value = '';
 $('searchHint').classList.remove('open');
 searchActive = false;
 doViewUpdate();
});

$('searchInput').addEventListener('input', function(){ doSearch(this.value); });
$('searchInput').addEventListener('keydown', function(e){ if (e.key === 'Escape') exitSearch(); });
$('searchCancelBtn').addEventListener('click', exitSearch);

function showConfirm(msg, onYes){
 confirmCb = onYes;
 $('confirmText').textContent = msg;
 $('confirmOverlay').classList.add('open');
 $('confirmNo').focus();
}

function closeConfirm(){
 $('confirmOverlay').classList.remove('open');
 confirmCb = null;
}

$('confirmYes').addEventListener('click', function(){
 $('confirmOverlay').classList.remove('open');
 if (confirmCb) {
 const cb = confirmCb;
 confirmCb = null;
 cb();
 }
});
$('confirmNo').addEventListener('click', closeConfirm);
$('confirmOverlay').addEventListener('click', function(e){
 if (e.target === this) closeConfirm();
});

document.addEventListener('keydown', function(e){
 if (e.key !== 'Escape') return;
 if ($('confirmOverlay').classList.contains('open')) closeConfirm();
 if ($('lightbox').classList.contains('open')) {
 $('lightbox').classList.remove('open');
 $('lbImg').src = '';
 }
});

load();
</script>
</body>
</html>
